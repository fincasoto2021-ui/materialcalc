  function loadBizVault() {
    try {
      var v = JSON.parse(localStorage.getItem("mcp_biz_vault_v1") || "null");
      if (v && typeof v === "object") return v;
    } catch (e) {}
    try {
      var old = JSON.parse(localStorage.getItem("mcp_biz_profile") || "null");
      if (old && old.comp && !/^mr\.?\s*invoice\s*pro$/i.test(String(old.comp).trim())) {
        return { comp: old.comp || "", owner: "", phone: old.phone || "", email: "", lic: "", locked: true };
      }
    } catch (e2) {}
    return { comp: "", owner: "", phone: "", email: "", lic: "", locked: false };
  }

  function saveBizVault(v) {
    var compClean = String(v.comp || "").trim();
    var ownerClean = String(v.owner || "").trim();
    var mainTitle = compClean || ownerClean;
    var clean = {
      comp: compClean,
      owner: ownerClean,
      phone: String(v.phone || "").trim(),
      email: String(v.email || "").trim(),
      lic: String(v.lic || "").trim(),
      locked: Boolean(mainTitle)
    };
    try {
      localStorage.setItem("mcp_biz_vault_v1", JSON.stringify(clean));
      var combinedSub = [clean.lic, clean.phone, clean.email].filter(Boolean).join(" • ");
      localStorage.setItem("mcp_biz_profile", JSON.stringify({ comp: mainTitle, phone: combinedSub }));
    } catch (e) {}
    return clean;
  }

      l: String(v.lic || "").slice(0, 70)
    };
    var json = JSON.stringify(mini);
    var b64 = btoa(unescape(encodeURIComponent(json)));
    return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function decodeCardPayload(token) {
    try {
      var b64 = String(token || "").replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      var json = decodeURIComponent(escape(atob(b64)));
      var o = JSON.parse(json);
      if (o && (o.c || o.p || o.o)) return o;
    } catch (e) {}
    return null;
  }

  function buildCardUrl(v) {
    return "https://mrinvoicepro.com/?bcard=" + encodeCardPayload(v);
  }

  function triggerVCardDownload(card) {
    var comp = String(card.c || "").trim();
    var owner = String(card.o || "").trim();
    var phone = String(card.p || "").trim();
    var email = String(card.e || "").trim();
    var lic = String(card.l || "").trim();
    var fn = comp ? (owner ? comp + " - " + owner : comp) : (owner || "Contacto");
    var lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "FN;CHARSET=UTF-8:" + fn.replace(/[\r\n]/g, " "),
      "N;CHARSET=UTF-8:" + (owner || comp).replace(/[\r\n;]/g, " ") + ";;;;"
    ];
    if (comp) lines.push("ORG;CHARSET=UTF-8:" + comp.replace(/[\r\n;]/g, " "));
    if (owner && comp) lines.push("TITLE;CHARSET=UTF-8:" + owner.replace(/[\r\n;]/g, " "));
    if (phone) lines.push("TEL;TYPE=CELL,VOICE:" + phone.replace(/[^\d+]/g, ""));
    if (email && email.indexOf("@") !== -1) lines.push("EMAIL;TYPE=INTERNET:" + email.trim());
    else if (email) lines.push("URL:" + (email.indexOf("http") === 0 ? email.trim() : "https://" + email.trim()));
    if (lic) lines.push("NOTE;CHARSET=UTF-8:" + lic.replace(/[\r\n]/g, " "));
    lines.push("URL:https://mrinvoicepro.com");
    lines.push("END:VCARD");
    var vcf = lines.join("\r\n");

    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      window.location.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcf);
      return;
    }
    var blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = ((comp || owner || "contacto").replace(/[^a-zA-Z0-9_-]/g, "_").slice(0, 32) || "contacto") + ".vcf";
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
  }

  box.id = "mip-help-panel";
  box.innerHTML =
    '<div id="mip-help-head">' +
      '<div id="mip-help-title"><span id="mip-help-ico">' + micSvg + '</span><span id="mipHelpTitleTxt">Help • Grabadora Turbo IA</span></div>' +
      '<button type="button" id="mip-help-close">X</button>' +
    '</div>' +
    '<textarea id="mip-help-text" rows="2" placeholder=""></textarea>' +
    '<div id="mip-bar">' +
      '<button type="button" id="mip-trash" title="Descartar">' + trashSvg + '</button>' +
      '<button type="button" id="mip-rec">' + micSvg + '<span>Grabar Voz</span></button>' +
      '<button type="button" id="mip-send" disabled title="Enviar">' + sendSvg + '</button>' +
    '</div>' +
    '<div id="mip-help-hint"></div>' +
    '<div id="mip-help-status"></div>';
  document.body.appendChild(box);

  var fab = document.createElement("button");
  fab.type = "button";
  fab.id = "mip-help-btn";
  fab.innerHTML = '<span id="mip-help-dot"></span>' + helpSvg + '<span>Help</span>';
  document.body.appendChild(fab);

  var recBtn = document.getElementById("mip-rec");
  var sendBtn = document.getElementById("mip-send");
  var trashBtn = document.getElementById("mip-trash");
  var inp = document.getElementById("mip-help-text");

  var mr = null, stream = null, chunks = [], recMime = "audio/webm";
  var state = "idle", secs = 0, timer = null, sendAfterStop = false;

  function fmtTime(t) {
    var m = Math.floor(t / 60), s = t % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function setStatus(msg, isErr) {
    var s = document.getElementById("mip-help-status");
    s.style.display = msg ? "block" : "none";
    s.style.color = isErr ? "#be123c" : "#065f46";
    s.textContent = msg || "";
  }

  function syncSendBtn() {
    var hasContent = state === "recording" || state === "paused" || chunks.length > 0 || inp.value.trim().length > 0;
    sendBtn.disabled = (state === "sending") || !hasContent;
    sendBtn.className = (!sendBtn.disabled && hasContent) ? "ready" : "";
  }

  inp.addEventListener("input", syncSendBtn);

  function releaseMic() {
    if (timer) { clearInterval(timer); timer = null; }
    if (stream) {
      try { stream.getTracks().forEach(function(t) { t.stop(); }); } catch (e) {}
      stream = null;
    }
  }

  function resetAllUI() {
    var BL = getBL();
    releaseMic();
    mr = null;
    chunks = [];
    secs = 0;
    state = "idle";
    sendAfterStop = false;
    recBtn.disabled = false;
    recBtn.className = "";
    recBtn.innerHTML = micSvg + '<span>' + escH(BL.recIdle) + '</span>';
    trashBtn.style.display = "none";
    syncSendBtn();
  }

  function syncBizAndRecorderI18n() {
    var BL = getBL();
    var map = {
      "mipTopBizTxt": BL.bizBtn,
      "mipSumEditBtn": BL.editBtn,
      "mipSumQrTxt": BL.qrBtn,
      "mipBizModalTitle": BL.modalTitle,
      "mipTabBtnInfo": BL.tabProfile,
      "mipTabBtnQr": BL.tabQr,
      "mipLblComp": BL.lblComp,
      "mipLblOwner": BL.lblOwner,
      "mipLblPhone": BL.lblPhone,
      "mipLblEmail": BL.lblEmail,
      "mipLblLic": BL.lblLic,
      "mipModalLogoBtn": BL.logoBtn,
      "mipModalSigBtn": BL.sigBtn,
      "mipSaveBizBtn": BL.saveBiz,
      "mipUnlockOnceBtn": BL.unlockOnce,
      "mipShareCardBtn": BL.shareCard,
      "mipCopyCardBtn": BL.copyLink,
      "mipPreviewCardBtn": BL.previewCard,
      "mipHelpTitleTxt": BL.helpTitle,
      "mip-help-hint": BL.helpHint
    };
    Object.keys(map).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.textContent = map[id];
    });
    document.getElementById("mipInpComp").placeholder = BL.phComp;
    document.getElementById("mipInpOwner").placeholder = BL.phOwner;
    document.getElementById("mipInpPhone").placeholder = BL.phPhone;
    document.getElementById("mipInpEmail").placeholder = BL.phEmail;
    document.getElementById("mipInpLic").placeholder = BL.phLic;
    inp.placeholder = BL.helpPh;
    if (state === "idle") recBtn.innerHTML = micSvg + '<span>' + escH(BL.recIdle) + '</span>';
    applyBizProtectionToForm();
  }

  fab.onclick = function() {
    if (box.style.display === "block") {
      if (state === "recording" || state === "paused") {
        sendAfterStop = false;
        if (mr && mr.state !== "inactive") { try { mr.stop(); } catch (e) {} }
        resetAllUI();
      }
      box.style.display = "none";
    } else {
      syncBizAndRecorderI18n();
      box.style.display = "block";
    }
  };
  document.getElementById("mip-help-close").onclick = fab.onclick;

  function applyDocData(obj) {
    var v = loadBizVault();
    var validTypes = ["quote","invoice","receipt","contract","billsale","lease","waiver","promissory","change","workorder","po","delivery"];
    if (obj.docType && validTypes.indexOf(obj.docType) !== -1) {
      var dt = document.getElementById("qb-doctype");
      if (dt) {
        dt.value = obj.docType;
        if (typeof safeSetStorage === "function") safeSetStorage("mcp_active_doctype", obj.docType);
        if (typeof syncActiveDocTypeUI === "function") syncActiveDocTypeUI();
      }
    }

    var isLockedBiz = Boolean(v.locked && (v.comp || v.owner) && !tempUnlockOnce);
    if (!isLockedBiz) {
      var iss = String(obj.issuer || "").trim();
      if (iss && !/^mr\.?\s*invoice\s*pro$/i.test(iss)) {
        var compEl = document.getElementById("qb-comp");
        if (compEl) compEl.value = iss;
      }
      if (obj.phone && String(obj.phone).trim()) {
        var phEl = document.getElementById("qb-phone");
        if (phEl) phEl.value = String(obj.phone).trim();
      }
    } else {
      applyBizProtectionToForm();
    }

    if (obj.client) {
      var cliEl = document.getElementById("qb-client");
      if (cliEl) cliEl.value = String(obj.client).trim();
    }
    if (Array.isArray(obj.items) && obj.items.length > 0 && typeof renderCustomLines === "function") {
      customLineItems = obj.items.map(function(it) {
        return { desc: String(it.desc || ""), qty: String(it.qty || 1), price: String(it.price !== undefined ? it.price : "") };
      });
      renderCustomLines();
    }
    document.getElementById("qb-disc-mode").value = "amt";
    document.getElementById("qb-disc").value = String(Number(obj.discAmt) || 0);
    if (Number(obj.taxPct) > 0) {
      document.getElementById("qb-tax-mode").value = "pct";
      document.getElementById("qb-tax").value = String(obj.taxPct);
    } else {
      document.getElementById("qb-tax-mode").value = "amt";
      document.getElementById("qb-tax").value = String(Number(obj.taxAmt) || 0);
    }
    document.getElementById("qb-ret-mode").value = "pct";
    document.getElementById("qb-ret").value = String(Number(obj.retPct) || 0);
    document.getElementById("qb-dep").value = String(Number(obj.dep) || 0);
    if (obj.notes) document.getElementById("qb-notes").value = String(obj.notes);

    if (typeof onBuilderUserEdit === "function") onBuilderUserEdit(false);
    inp.value = "";
    resetAllUI();
    box.style.display = "none";
    setStatus("", false);
    if (typeof showExecutiveToast === "function") showExecutiveToast("✨ OK", 2600);
  }

  function blobToBase64(blob) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onloadend = function() {
        var res = String(reader.result || "");
        var comma = res.indexOf(",");
        resolve(comma !== -1 ? res.slice(comma + 1) : res);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function sendToTurboWorker(audioB64, mimeStr, extraText) {
    var BL = getBL();
    state = "sending";
    recBtn.disabled = true;
    sendBtn.disabled = true;
    trashBtn.style.display = "none";
    setStatus(BL.stSend, false);

    var lg = (typeof currentLang !== "undefined" && currentLang) ? currentLang : "es";
    var sys = 'Eres un asistente experto redactando documentos comerciales en idioma "' + lg + '". Escucha el audio y/o lee la nota del usuario. Si se corrige mientras habla, usa solo el dato corregido final. PROHIBIDO poner "Mr. Invoice Pro" como nombre de empresa (issuer); deja issuer="" a menos que el usuario dicte explícitamente el nombre de su propio negocio. Redacta descripciones profesionales claras para cada partida. Devuelve SOLO JSON válido exacto: {"docType":"quote|invoice|receipt|contract|billsale|lease|waiver|promissory|change|workorder|po|delivery","issuer":"","phone":"","client":"","items":[{"desc":"","qty":1,"price":0}],"taxPct":0,"taxAmt":0,"discAmt":0,"retPct":0,"dep":0,"notes":""}';

    var payload = { system: sys };
    if (audioB64) {
      payload.audioBase64 = audioB64;
      payload.mimeType = mimeStr || "audio/webm";
    }
    if (extraText) payload.prompt = extraText;

    try {
      var r = await fetch(WORKER + "?t=" + Date.now(), {
        method: "POST",
        mode: "cors",
        cache: "no-store",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify(payload)
      });
      var d = await r.json();
      if (!d || !d.ok || !d.text) throw new Error((d && d.error) ? d.error : "Empty");
      var i1 = d.text.indexOf("{"), i2 = d.text.lastIndexOf("}");
      if (i1 === -1 || i2 === -1) throw new Error("JSON");
      applyDocData(JSON.parse(d.text.slice(i1, i2 + 1)));
    } catch (err) {
      resetAllUI();
      setStatus(BL.stErr.replace("{E}", String(err.message || "Error")), true);
    }
  }

  function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(function() {
      secs++;
      if (state === "recording") {
        recBtn.innerHTML = pauseSvg + '<span>' + escH(getBL().recStop) + ' (' + fmtTime(secs) + ')</span>';
      }
    }, 1000);
  }

  async function beginRecording() {
    var BL = getBL();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
      inp.focus();
      setStatus(BL.stMic, true);
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      var candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
      recMime = "";
      for (var i = 0; i < candidates.length; i++) {
        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) {
          recMime = candidates[i];
          break;
        }
      }
      chunks = [];
      try {
        mr = recMime
          ? new MediaRecorder(stream, { mimeType: recMime, audioBitsPerSecond: 24000 })
          : new MediaRecorder(stream, { audioBitsPerSecond: 24000 });
      } catch (e1) {
        mr = new MediaRecorder(stream);
      }
      recMime = mr.mimeType || recMime || "audio/webm";

      mr.ondataavailable = function(ev) {
        if (ev.data && ev.data.size > 0) chunks.push(ev.data);
      };

      mr.onstop = async function() {
        releaseMic();
        if (!sendAfterStop) {
          resetAllUI();
          return;
        }
        sendAfterStop = false;
        var blob = new Blob(chunks, { type: recMime });
        chunks = [];
        if (blob.size < 400 && !inp.value.trim()) {
          resetAllUI();
          setStatus(getBL().stNoAud, true);
          return;
        }
        try {
          var b64 = blob.size >= 400 ? await blobToBase64(blob) : "";
          await sendToTurboWorker(b64, recMime, inp.value.trim());
        } catch (err) {
          resetAllUI();
          setStatus(getBL().stErr.replace("{E}", "Audio"), true);
        }
      };

      mr.start(250);
      secs = 0;
      state = "recording";
      recBtn.className = "rec";
      recBtn.innerHTML = pauseSvg + '<span>' + escH(BL.recStop) + ' (0:00)</span>';
      trashBtn.style.display = "flex";
      syncSendBtn();
      setStatus(BL.stRec, false);
      startTimer();
    } catch (err) {
      resetAllUI();
      setStatus(BL.stMic, true);
    }
  }

  recBtn.onclick = function() {
    var BL = getBL();
    if (state === "sending") return;
    if (state === "idle") {
      beginRecording();
      return;
    }
    if (state === "recording") {
      if (mr && mr.state === "recording" && typeof mr.pause === "function") {
        mr.pause();
        if (timer) { clearInterval(timer); timer = null; }
        state = "paused";
        recBtn.className = "paused";
        recBtn.innerHTML = micSvg + '<span>' + escH(BL.recCont) + ' (' + fmtTime(secs) + ')</span>';
        syncSendBtn();
        setStatus(BL.stPause.replace("{T}", fmtTime(secs)), false);
      }
      return;
    }
    if (state === "paused") {
      if (mr && mr.state === "paused" && typeof mr.resume === "function") {
        mr.resume();
        state = "recording";
        recBtn.className = "rec";
        recBtn.innerHTML = pauseSvg + '<span>' + escH(BL.recStop) + ' (' + fmtTime(secs) + ')</span>';
        syncSendBtn();
        setStatus(BL.stRec, false);
        startTimer();
      }
    }
  };

  trashBtn.onclick = function() {
    sendAfterStop = false;
    if (mr && mr.state !== "inactive") {
      try { mr.stop(); } catch (e) { resetAllUI(); }
    } else {
      resetAllUI();
    }
    setStatus(getBL().stDisc, false);
  };

  sendBtn.onclick = function() {
    if (state === "sending") return;
    if (state === "recording" || state === "paused") {
      sendAfterStop = true;
      if (timer) { clearInterval(timer); timer = null; }
      if (mr && mr.state !== "inactive") {
        try { mr.requestData(); } catch (e) {}
        try { mr.stop(); } catch (e) { resetAllUI(); }
      }
      return;
    }
    var txt = inp.value.trim();
    if (txt) sendToTurboWorker("", "", txt);
  };

  var origApplyLang = window.applyLanguageUI;
  if (typeof origApplyLang === "function") {
    window.applyLanguageUI = function() {
      origApplyLang();
      syncBizAndRecorderI18n();
      if (bizModal.style.display === "flex" && document.getElementById("mipPaneQr").style.display === "block") {
        renderBizQrCode();
      }
    };
  }

  var origSyncDoc = window.syncActiveDocTypeUI;
  if (typeof origSyncDoc === "function") {
    window.syncActiveDocTypeUI = function() {
      origSyncDoc();
      applyBizProtectionToForm();
    };
  }

  var origResetZero = window.resetBuilderToZero;
  if (typeof origResetZero === "function") {
    window.resetBuilderToZero = function() {
      tempUnlockOnce = false;
      origResetZero();
      applyBizProtectionToForm();
    };
  }

  window.addEventListener("DOMContentLoaded", function() {
    setTimeout(syncBizAndRecorderI18n, 80);
  });
  setTimeout(syncBizAndRecorderI18n, 150);
})();
</script>
</body>
</html>
