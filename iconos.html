<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Íconos Cuadrados | Mr. Invoice Pro</title>
<style>
  body { background:#0f172a; color:#fff; font-family:sans-serif; text-align:center; padding:2rem 1rem; }
  canvas { border:3px solid #facc15; border-radius:24px; margin:1rem auto; display:block; max-width:240px; }
  button { background:#25D366; color:#052e16; font-weight:900; border:none; padding:1rem 1.4rem; border-radius:10px; font-size:1rem; margin:0.5rem; cursor:pointer; width:100%; max-width:340px; }
</style>
</head>
<body>
  <h2>Íconos Cuadrados Oficiales (PNG)</h2>
  <p style="color:#cbd5e1;font-size:0.9rem;">Toca los dos botones para descargar los íconos cuadrados exactos con el superhéroe:</p>
  <canvas id="c512" width="512" height="512"></canvas>
  <canvas id="c192" width="192" height="192" style="display:none;"></canvas>
  <button onclick="dl('c512','icon-512.png')">⬇️ 1. Descargar icon-512.png</button><br>
  <button onclick="dl('c192','icon-192.png')">⬇️ 2. Descargar icon-192.png</button>
<script>
const img = new Image();
img.crossOrigin = "anonymous";
img.src = "/1793842789444.jpg";
img.onload = function() {
  ['c512','c192'].forEach(id => {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    const size = c.width;
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, size, size);
    const s = Math.min(img.width, img.height);
    const sx = (img.width - s) / 2;
    const sy = (img.height - s) * 0.22; 
    ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
  });
};
function dl(id, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = document.getElementById(id).toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
